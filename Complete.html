<!DOCTYPE html>
<html>

<head>
    <title>Thank you</title>
    <meta charset="UTF-8">

    <!-- Function to make POST requests -->
    <script src="./Assets/PostJson.js"></script>

    <!-- Get participant IDs passed in from URL -->
    <script src="./Assets/GetPpantIds.js"></script>

    <!-- Get DateTime_Start and ClientTimeZone (and add to TaskIO) -->
    <script src="./Assets/SetDateTime.js"></script>

    <!-- Set the favicon logo -->
    <link rel="icon" href="./Assets/Logo.png" type="image/x-icon" />

    <!-- Import the stylesheet -->
    <link rel="stylesheet" href="./Assets/w3.css">

    <!-- Some more styling -->
    <style>
        body {
            padding: 30px 0;
        }
    </style>

    <!-- Main script block -->
    <script>
        async function GetCompletionLink() {
            var Result = await PostJson('./GetCompletionLink.php',
                { SubjectId: SubjectId });
            return Result;
        }

        async function GetFeedback() {
            var Result = await PostJson('./GetFeedback.php',
                { SubjectId: SubjectId });
            return Result;
        }

        async function WriteFeedback() {
            var Result = await PostJson('./WriteFeedback.php',
                {
                    SubjectId: SubjectId,
                    Feedback: document.getElementById('FeedbackArea').value
                });
            return Result;
        }

        var FeedbackEditable = true;
        function OnButtonClick() {
            if (FeedbackEditable) {
                WriteFeedback().then(function () {
                    document.getElementById("FeedbackArea").disabled = true;
                    document.getElementById('FeedbackButton').innerText = 
                        'Edit feedback';
                    FeedbackEditable = false;
                });
            } else {
                document.getElementById("FeedbackArea").disabled = false;
                document.getElementById('FeedbackButton').innerText = 
                    'Submit feedback';
                FeedbackEditable = true;
            }
        }

        async function OnBodyLoad() {
            var Response0 = await GetCompletionLink();
            var Response1 = await GetFeedback();

            if (!Response0.FoundSubject) {
                alert('Sorry, we could not find any record of your ' +
                    'participation.\nPlease contact Sophie Johnson at ' +
                    'sj483@sussex.ac.uk.');
                var ErrorCode = 'XXX';
                var URL = "./Error.html?SubjectId=" +
                    encodeURIComponent(String(SubjectId)) +
                    '&ErrorCode=' +
                    encodeURIComponent(String(ErrorCode)) +
                    "#";
                window.location.replace(URL);
                return;
            }

            if (!Response0.Completed) {
                alert('Sorry, it appears that you have not ' +
                    'completed all parts of the experiment yet. ' +
                    'I am not sure how you ended up on this page.');
                var ErrorCode = 'XXX';
                var URL = "./Error.html?SubjectId=" +
                    encodeURIComponent(String(SubjectId)) +
                    '&ErrorCode=' +
                    encodeURIComponent(String(ErrorCode)) +
                    "#";
                window.location.replace(URL);
                return;
            }

            document.getElementById('CompletionLink').outerHTML =
                Response0.CompletionLink;

            if (Response1.FeedbackFound) {
                FeedbackEditable = false;
                document.getElementById('FeedbackArea').value =
                    Response1.Feedback;
                document.getElementById('FeedbackButton').innerText =
                    'Edit feedback';
            } else {
                document.getElementById("FeedbackArea").disabled = false;
                document.getElementById('FeedbackButton').innerText =
                    'Submit feedback';
            }
            document.getElementById("FeedbackButton").disabled = false;

            document.getElementById("HtmlBody").style.visibility =
                "visible";
        }
    </script>
</head>

<body class="w3-center" style="visibility: hidden;" onload="OnBodyLoad()" id="HtmlBody">
    <h1>Thank you! &#128591;</h1>
    <p>The experiment is now complete. Thank you for taking part.</p>
    <p>Please feel free to leave us feedback in the following text box.</p>
    <textarea id="FeedbackArea" rows="7" cols="67" disabled></textarea>
    <br /><br />
    <button id="FeedbackButton" onclick="OnButtonClick()" disabled>
        Please wait</button>
    <br /><br />
    <p>Click on the link below to make your submission:<br />
        <a id="CompletionLink" href="./Error.html" target="_blank">###</a>
    </p>
</body>

</html>
