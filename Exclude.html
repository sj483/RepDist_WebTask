<!DOCTYPE html>
<html>

<head>
    <title>Sorry!</title>
    <meta charset="utf-8" />

    <!-- Set the favicon logo -->
    <link rel="icon" href="./Assets/Logo.png" type="image/x-icon" />

    <!-- Import the stylesheet -->
    <link rel="stylesheet" href="./Assets/w3.css">

    <!-- Import the user agent parser -->
    <script src="./Assets/ua-parser.pack.js"></script>

    <!-- Some more styling -->
    <style>
        body {
            padding: 30px 0;
        }
    </style>

    <script>

        // OnBodyLoad function
        function OnBodyLoad() {

            // Get UserAgentResult
            var UserAgentParser = new UAParser();
            var UserAgentResult = UserAgentParser.getResult();

            var IsMobile = /Android|Mobile|iOS|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(UserAgentResult.ua);

            // Get screen resolution
            var ScreenWidth = window.screen.width;
            var ScreenHeight = window.screen.height;

            // If they are using IE, prep the message to display:
            var Message;
            if (IsMobile) {
                Message = "<p>You are not able to run the experiment on " +
                    "this device.<br>Please use a laptop or desktop " +
                    "computer.</p>";
            } else if (UserAgentResult.browser.name.includes('IE') ||
                UserAgentResult.browser.name.includes('Edge')) {
                Message = "<p>You are not able to run the experiment " +
                    "using Internet Explorer or Edge.<br /><br />" +
                    "Please download a different web browser. We recommend " +
                    "<a href='https://www.google.com/chrome/'>" +
                    "Google Chrome</a>.</p>";

            } else if ((ScreenHeight < 720) || (ScreenWidth < 1280)) {
                Message = "<p>The resolution of your screen is too low " +
                    "to run this experiment.<br /><br />" +
                    "Please use a different device.</p>";
            }

            // Display the main div
            if (Boolean(Message)) {
                document.getElementById('Message').innerHTML = Message;
            }
            document.getElementById('MainDiv').style.visibility = 'visible';
        }
    </script>
</head>

<body onload="OnBodyLoad()">
    <div style="visibility:hidden;" id="MainDiv" class="w3-center">
        <h1>Sorry! &#129335;</h1>
        <div id='Message'>
            <p>
                You are not able to run the experiment on this device.
                <br>Please use a laptop or desktop computer.
            </p>
        </div>
    </div>
</body>

</html>
